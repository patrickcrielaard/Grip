{% extends "base.html" %}

{% block title %}Grip · Tasks{% endblock %}
{% block body_class %}app-page{% endblock %}

{% block content %}
<div class="app-layout">
    <aside class="sidebar">
        <div class="sidebar-profile">
            <div class="profile-avatar">{{ username[0] | upper }}</div>
            <span class="profile-name">{{ username }}</span>
            <form class="logout-form" action="/logout" method="post">
                <button class="sidebar-icon-btn" type="submit" aria-label="Log out">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
                        <polyline points="16 17 21 12 16 7"/>
                        <line x1="21" y1="12" x2="9" y2="12"/>
                    </svg>
                </button>
            </form>
        </div>

        <div class="sidebar-section">
            <span class="sidebar-section-label">To Do</span>
            <nav class="sidebar-nav" aria-label="Primary">
                <button class="sidebar-item active" type="button" data-list="inbox" aria-pressed="true">
                    <svg class="sidebar-icon" viewBox="0 0 24 24">
                        <polyline points="22 12 16 12 14 15 10 15 8 12 2 12"/>
                        <path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/>
                    </svg>
                    <span class="sidebar-label">Inbox</span>
                    <span class="sidebar-count" data-count-list="inbox"></span>
                </button>
                <button class="sidebar-item" type="button" data-list="today" aria-pressed="false">
                    <svg class="sidebar-icon" viewBox="0 0 24 24">
                        <circle cx="12" cy="12" r="5"/>
                        <line x1="12" y1="1" x2="12" y2="3"/>
                        <line x1="12" y1="21" x2="12" y2="23"/>
                        <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/>
                        <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
                        <line x1="1" y1="12" x2="3" y2="12"/>
                        <line x1="21" y1="12" x2="23" y2="12"/>
                        <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/>
                        <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
                    </svg>
                    <span class="sidebar-label">Today</span>
                    <span class="sidebar-count" data-count-list="today"></span>
                </button>
                <button class="sidebar-item" type="button" data-view="all" aria-pressed="false">
                    <svg class="sidebar-icon" viewBox="0 0 24 24">
                        <line x1="8" y1="6" x2="21" y2="6"/>
                        <line x1="8" y1="12" x2="21" y2="12"/>
                        <line x1="8" y1="18" x2="21" y2="18"/>
                        <line x1="3" y1="6" x2="3.01" y2="6"/>
                        <line x1="3" y1="12" x2="3.01" y2="12"/>
                        <line x1="3" y1="18" x2="3.01" y2="18"/>
                    </svg>
                    <span class="sidebar-label">All Tasks</span>
                    <span class="sidebar-count" data-count-view="all"></span>
                </button>
                <button class="sidebar-item" type="button" data-view="completed" aria-pressed="false">
                    <svg class="sidebar-icon" viewBox="0 0 24 24">
                        <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>
                        <polyline points="22 4 12 14.01 9 11.01"/>
                    </svg>
                    <span class="sidebar-label">Completed</span>
                    <span class="sidebar-count" data-count-view="completed"></span>
                </button>
            </nav>
        </div>

        <div class="sidebar-section">
            <span class="sidebar-section-label">Areas</span>
            <nav class="sidebar-nav" aria-label="Areas">
                <button class="sidebar-item" type="button" data-area-filter="personal" aria-pressed="false">
                    <span class="sidebar-dot dot-personal"></span>
                    <span class="sidebar-label">Personal</span>
                    <span class="sidebar-count" data-count-area="personal"></span>
                </button>
                <button class="sidebar-item" type="button" data-area-filter="work" aria-pressed="false">
                    <span class="sidebar-dot dot-work"></span>
                    <span class="sidebar-label">Work</span>
                    <span class="sidebar-count" data-count-area="work"></span>
                </button>
            </nav>
        </div>
    </aside>

    <main class="main-content">
        <div class="content-header">
            <div class="content-header-left">
                <h1 class="content-title" id="activeListLabel">Inbox</h1>
                <span class="content-task-count" id="itemCount">0 tasks</span>
            </div>
            <div class="content-header-actions">
                <button class="header-action-btn" id="addTaskToggle" type="button" aria-label="Add task">
                    <svg viewBox="0 0 24 24">
                        <line x1="12" y1="5" x2="12" y2="19"/>
                        <line x1="5" y1="12" x2="19" y2="12"/>
                    </svg>
                </button>
            </div>
        </div>

        <div class="add-task-row" id="addTaskRow" hidden>
            <div class="add-task-input-group">
                <input type="text" id="todoInput" placeholder="New task..." class="add-task-input" autocomplete="off">
                <select id="areaSelect" class="add-task-select" aria-label="Task area">
                    <option value="">No area</option>
                    <option value="personal">Personal</option>
                    <option value="work">Work</option>
                </select>
                <select id="prioritySelect" class="add-task-select" aria-label="Task priority">
                    <option value="not_set">No priority</option>
                    <option value="low">Low</option>
                    <option value="medium">Medium</option>
                    <option value="high">High</option>
                </select>
                <button id="addBtn" class="add-task-submit" type="button">Add</button>
            </div>
        </div>

        <div id="statusMessage" class="status-message" role="status" aria-live="polite"></div>

        <ul id="todoList" class="task-list">
            <!-- Todo items injected by JS -->
        </ul>

        <div class="content-footer">
            <button id="clearCompleted" class="footer-action" type="button">Clear completed</button>
        </div>
    </main>
</div>
{% endblock %}

{% block scripts %}
<script src="/static/js/app.js?v=2"></script>
{% endblock %}
